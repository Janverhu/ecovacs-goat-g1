name: Tests

# Reusable test job. Validate runs it on every push and pull request, and the
# develop pre-release and stable release only publish after it passes, so a
# failing test never reaches HACS.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest pytest-asyncio aiohttp cryptography "paho-mqtt>=2.1.0"
      - run: python -m pytest tests/ecovacs_goat_g1
      - run: python -m compileall custom_components/ecovacs_goat_g1 tests/ecovacs_goat_g1
