name: Release

# Publishes a stable GitHub release when main is updated and the tests pass. The stable version is
# the manifest's base version with any pre-release suffix stripped
# (e.g. 0.3.0b1 -> stable 0.3.0), so merging the current beta line into main
# promotes it to a release. If that version was already released the run is a
# no-op; start the next stable line by bumping the manifest base on develop
# (e.g. to 0.4.0b1). The computed version is written back into manifest.json and
# committed to main so Home Assistant reports the correct installed version.
# Development betas are handled separately by develop-prerelease.yml.
#
# The bot commits below must never contain a skip marker such as [skip ci]: a
# squash merge of develop copies every commit message into the commit on main,
# and GitHub then skips this workflow for that push. The markers are not needed,
# because pushes made with GITHUB_TOKEN do not trigger workflows. If a push to
# main still does not produce a release, run this workflow manually on main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-release
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  release:
    name: Publish stable release
    needs: tests
    # A manual run from another branch would push that branch's HEAD to main.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      # Run JavaScript actions on Node.js 24 (Node 20 is being deprecated).
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute stable version
        id: ver
        run: |
          base="$(python -c "import json, re; print(re.match(r'(\d+\.\d+\.\d+)', json.load(open('custom_components/ecovacs_goat_g1/manifest.json'))['version']).group(1))")"
          echo "version=${base}" >> "$GITHUB_OUTPUT"
          echo "Target stable version: ${base}"

      - name: Check whether this version is already released
        id: tag
        run: |
          git fetch --tags --force
          if git rev-parse "refs/tags/${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.ver.outputs.version }} already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync manifest version and commit to main
        id: sync
        if: steps.tag.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python -c "
          import json, os
          path = 'custom_components/ecovacs_goat_g1/manifest.json'
          data = json.load(open(path))
          data['version'] = os.environ['VERSION']
          with open(path, 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          "
          if ! git diff --quiet -- custom_components/ecovacs_goat_g1/manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add custom_components/ecovacs_goat_g1/manifest.json
            git commit -m "Release ${VERSION}"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish stable release ${{ steps.ver.outputs.version }}
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          target_commitish: ${{ steps.sync.outputs.sha }}
          prerelease: false
          generate_release_notes: true

      - name: Merge the stable manifest back into develop
        if: steps.tag.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # The release commit and the next beta bump both edit manifest.json.
          # Merging that commit into develop now makes the next develop -> main
          # merge a one-sided version change, so Git does not report a conflict.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git checkout -B develop origin/develop
          if git merge --no-edit main; then
            git push origin HEAD:develop
            exit 0
          fi
          conflicted="$(git diff --name-only --diff-filter=U)"
          if [ "$conflicted" != "custom_components/ecovacs_goat_g1/manifest.json" ]; then
            echo "Back-merge into develop has conflicts beyond the version line:"
            echo "$conflicted"
            exit 1
          fi
          git checkout --theirs custom_components/ecovacs_goat_g1/manifest.json
          git add custom_components/ecovacs_goat_g1/manifest.json
          git commit -m "Sync stable ${VERSION} from main"
          git push origin HEAD:develop
